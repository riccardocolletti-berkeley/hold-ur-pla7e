# Ad-hoc config to test lab-style PID gains in the sim viewer without
# touching sim.yaml. Pass it with `--config sim/config/sim_lab_pid.yaml`.

trajectory:
  home:        [0.0, -1.57, 1.57, -1.57, 1.57, 0.0]
  dest_offset: [1.0,  0.15, -0.15, 0.0, 0.0, 0.0]
  mid_offset:  [0.5,  0.08, -0.08, 0.0, 0.0, 0.0]
  durations:   [2.0, 5.0, 5.0, 3.0, 2.5, 1.5]

gains:
  Kp_joint: [500, 500, 500, 200, 200, 200]
  Kd_joint: [ 50,  50,  50,  20,  20,  20]

pid:
  Kp_ball:      0.5
  Ki_ball:      0.0
  Kd_ball:      1.5
  Kff_ball:     0.0
  alpha:        0.2754
  max_tilt:     0.1
  windup_limit: 0.05

mpc:
  horizon:  25
  dt:       0.01667
  q_pos:    150.0
  q_vel:    15.0
  r_u:      1.0
  qf_pos:   750.0
  qf_vel:   75.0

ball_trajectory:
  shape:       circle
  radius:      0.075
  period:      10.0
  settle_time: 3.0

render_fps: 60
