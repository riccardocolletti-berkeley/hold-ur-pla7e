[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim"
version = "0.1.0"
description = "MuJoCo simulator wiring for the ball-on-plate monorepo: scene, adapters, controllers, RL training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ballplate",
    "mujoco>=3.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = [
    "ballplate[rl]",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.15",
]
video = [
    "imageio[ffmpeg]>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]

[tool.uv.sources]
ballplate = { workspace = true }
