[project]
name = "eecs206a-ball-plate"
version = "0.1.0"
description = "Ball-on-plate stack: shared domain library, MuJoCo simulator, real-robot bring-up, browser trajectory designer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# The root project is a meta-package: it pulls in every workspace member so
# `uv sync` resolves the whole monorepo against a single lockfile.
dependencies = [
    "ballplate",
    "designer",
    "real-vision",
    "sim",
]

[project.optional-dependencies]
rl    = ["sim[rl]"]
video = ["sim[video]"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "scipy-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Don't build a wheel for the root meta-package.
[tool.hatch.build.targets.wheel]
bypass-selection = true

# ----------------------------------------------------------------------------
# uv workspace
# ----------------------------------------------------------------------------
[tool.uv.workspace]
members = ["ballplate", "designer", "real", "sim"]

[tool.uv.sources]
ballplate   = { workspace = true }
designer    = { workspace = true }
real-vision = { workspace = true }
sim         = { workspace = true }

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "real/ros2_ws/build",
    "real/ros2_ws/install",
    "real/ros2_ws/log",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced softly via the formatter
    "B008",   # function default arg calls (common in dataclass defaults)
    "SIM108", # ternary collapse (often less readable on long expressions)
    "RUF001", # ambiguous unicode in strings: math notation (×, −, ω, μ, …) is used on purpose
    "RUF002", # ambiguous unicode in docstrings: same as above
    "RUF003", # ambiguous unicode in comments: same as above
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*"               = ["B011"]
"real/ros2_ws/src/**"      = ["F401"]   # ROS launch files import for side effects
"sim/src/sim/learning/**"  = ["B023"]   # SB3 callbacks legitimately bind in loops

[tool.ruff.lint.isort]
known-first-party = ["ballplate", "designer", "sim", "vision"]

[tool.pytest.ini_options]
testpaths = [
    "ballplate/tests",
    "sim/tests",
]
addopts = "-ra"

# Strict type-checking on the domain library; the rest of the workspace
# (sim, real, designer) is left untyped for now.
[tool.mypy]
files = ["ballplate/src/ballplate"]
mypy_path = ["ballplate/src"]
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true

# stable_baselines3 ships no stubs; only the RL inference path imports it
# and we trust its runtime contract.
[[tool.mypy.overrides]]
module = ["stable_baselines3"]
ignore_missing_imports = true

# Coverage report: scoped to the domain library and the sim adapters that
# are unit-tested in this repo. The ROS workspace and the designer are
# integration-tested by hand.
[tool.coverage.run]
branch = true
source = ["ballplate", "sim"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "sim/src/sim/learning/*",  # PPO training pipeline is not exercised in CI
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
